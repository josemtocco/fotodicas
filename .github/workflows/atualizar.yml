name: Atualizar lista M3U (Fotodicas)

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: atualizar-m3u
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Conferir ffmpeg
        run: ffmpeg -version | head -1

      - name: Gerar a lista e testar os canais
        run: python atualizar_m3u.py
        continue-on-error: true

      - name: Garantir arquivos de estado
        if: always()
        run: |
          [ -f estado_canais.json ] || echo '{}' > estado_canais.json
          [ -f fotodicas.m3u ] || printf '#EXTM3U\n' > fotodicas.m3u
          [ -f relatorio_teste.csv ] || printf 'canal,status,detalhe\n' > relatorio_teste.csv
          ls -l fotodicas.m3u estado_canais.json relatorio_teste.csv

      - name: Publicar os arquivos (ate 5 tentativas)
        if: always()
        env:
          GIT_AUTHOR_NAME: robo-m3u
          GIT_AUTHOR_EMAIL: robo@users.noreply.github.com
          GIT_COMMITTER_NAME: robo-m3u
          GIT_COMMITTER_EMAIL: robo@users.noreply.github.com
        run: |
          set -u
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add -- fotodicas.m3u estado_canais.json relatorio_teste.csv
          if git diff --cached --quiet; then
            echo "Nada mudou nesta rodada."
            exit 0
          fi
          git commit -m "Atualizacao automatica: $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            echo "== tentativa de envio $i =="
            git rebase --abort 2>/dev/null || true
            git merge --abort 2>/dev/null || true
            if git push origin HEAD:main; then
              echo "Enviado na tentativa $i."
              exit 0
            fi
            git fetch origin main
            git reset --hard origin/main
            echo "Lista refeita do zero sobre a versao mais nova..."
            python atualizar_m3u.py || true
            [ -f estado_canais.json ] || echo '{}' > estado_canais.json
            [ -f fotodicas.m3u ] || printf '#EXTM3U\n' > fotodicas.m3u
            [ -f relatorio_teste.csv ] || printf 'canal,status,detalhe\n' > relatorio_teste.csv
            git add -- fotodicas.m3u estado_canais.json relatorio_teste.csv
            git commit -m "Atualizacao automatica (retentativa $i)" || true
            sleep $((i * 10))
          done
          echo "Nao foi possivel enviar depois de 5 tentativas."
          exit 1
